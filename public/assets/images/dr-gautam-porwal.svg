      <circle cx="12" cy="97" r="4" fill="#52C480"/>
      <text x="24" y="101" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">Doctor Available</text>
    </g>

    <!-- Three Services Grid Inside Card -->
    <g transform="translate(25, 190)">
      <!-- Specialty 1 -->
      <rect x="0" y="0" width="122" height="145" rx="12" fill="#F8F6F1" stroke="#EADBCC" stroke-width="1"/>
      <rect x="12" y="14" width="28" height="28" rx="6" fill="#E8ECE9"/>
      <text x="18" y="32" font-size="14">🌿</text>
      <text x="12" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#121614">Skin &amp; Hair</text>
      <text x="12" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#69756C">Acne, eczema, psoriasis therapies</text>
      <text x="12" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#254332">Explore →</text>

      <!-- Specialty 2 -->
      <rect x="134" y="0" width="122" height="145" rx="12" fill="#F8F6F1" stroke="#EADBCC" stroke-width="1"/>
      <rect x="146" y="14" width="28" height="28" rx="6" fill="#E8ECE9"/>
      <text x="152" y="32" font-size="14">⚕️</text>
      <text x="146" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#121614">Chronic Care</text>
      <text x="146" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#69756C">Paralysis, allergies &amp; asthma relief</text>
      <text x="146" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#254332">Explore →</text>

      <!-- Specialty 3 -->
      <rect x="268" y="0" width="122" height="145" rx="12" fill="#F8F6F1" stroke="#EADBCC" stroke-width="1"/>
      <rect x="280" y="14" width="28" height="28" rx="6" fill="#E8ECE9"/>
      <text x="286" y="32" font-size="14">👶</text>
      <text x="280" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#121614">Child Health</text>
      <text x="280" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#69756C">Pediatric immunity &amp; growth care</text>
      <text x="280" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#254332">Explore →</text>
    </g>
  </g>

  <!-- Bottom Proof Bar -->
  <g transform="translate(80, 520)">
    <rect width="1040" height="100" rx="16" fill="#FFFFFF" stroke="#E5DDD0" stroke-width="1.2" filter="url(#cardShadow)"/>
    
    <g transform="translate(50, 32)">
      <text x="0" y="24" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#16291E">15,000+</text>
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#68756C">Patient Consultations</text>
    </g>
    <line x1="260" y1="20" x2="260" y2="80" stroke="#EFE9DE" stroke-width="1.5"/>

    <g transform="translate(310, 32)">
      <text x="0" y="24" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#16291E">98.4%</text>
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#68756C">Positive Recovery Rate</text>
    </g>
    <line x1="520" y1="20" x2="520" y2="80" stroke="#EFE9DE" stroke-width="1.5"/>

    <g transform="translate(570, 32)">
      <text x="0" y="24" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#16291E">2013</text>
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#68756C">Best Doctor University Award</text>
    </g>
    <line x1="780" y1="20" x2="780" y2="80" stroke="#EFE9DE" stroke-width="1.5"/>

    <g transform="translate(830, 32)">
      <text x="0" y="24" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#16291E">100% Pure</text>
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#68756C">German Homeopathic Dilutions</text>
    </g>
  </g>

  <!-- Studio Watermark / Footer Strip -->
  <g transform="translate(80, 645)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#758277" letter-spacing="1">YUGARK DIGITAL STUDIO • TURNKEY HEALTHCARE DEMO</text>
    <text x="1040" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#849186" text-anchor="end">Live Preview: drgautamporwal.demo.yugark.in</text>
  </g>
</svg>
